# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version this repository
# has tested — no .env editing required. Setting SIYUAN_IMAGE_TAG in .env
# overrides the default; .env itself carries only secrets and deliberate
# overrides. CI reads the pin from this line.
x-images:
  siyuan: &siyuan-image ${SIYUAN_IMAGE_TAG:-b3log/siyuan:v3.8.2@sha256:af1442205fd60a8f5710c46c7e4c92bf3c8c1c9405026823496e4459f821549c}

networks:
  siyuan-network:
    external: true

volumes:
  siyuan-backups:

services:
  siyuan:
    image: *siyuan-image
    # Resource limits as .env-overridable defaults (e.g. SIYUAN_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SIYUAN_MEMORY_LIMIT:-512m}
          cpus: "${SIYUAN_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${SIYUAN_MEMORY_RESERVATION:-64m}
          cpus: "${SIYUAN_CPU_RESERVATION:-0.25}"
    # SiYuan v3.8 made the kernel a subcommand CLI: `serve` replaces the
    # old flag-only invocation, and the access code moved to the
    # SIYUAN_ACCESS_AUTH_CODE environment variable (the old
    # --accessAuthCode flag now just prints the help text and the
    # container restart-loops).
    command: ['serve', '--workspace=/siyuan/workspace/']
    volumes:
      - ./workspace:/siyuan/workspace
    environment:
      SIYUAN_ACCESS_AUTH_CODE: ${SIYUAN_AUTH_CODE:?set in .env - see .env.example for generation command}
      TZ: ${SIYUAN_TIMEZONE:-America/New_York}
    networks:
      - siyuan-network
    ports:
      - "6806:6806"
    restart: unless-stopped

  backups:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    # Resource limits as .env-overridable defaults (e.g. SIYUAN_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${SIYUAN_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${SIYUAN_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${SIYUAN_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${SIYUAN_BACKUPS_CPU_RESERVATION:-0.1}"
    # Every cycle: a consistent online copy of each SQLite database through
    # Python's backup API (no application stop), then a tar.gz of the rest of
    # the data directory (live database files excluded - the copies above are
    # the consistent ones). Logs OK/FAILED per artefact; a failed archive is
    # kept as .failed for diagnosis; retention 0 disables pruning.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep "$$SIYUAN_BACKUP_INIT_SLEEP"
        while true; do
          STAMP="$$(date +%Y-%m-%d_%H-%M)"
          DATA_FILE="$$SIYUAN_BACKUPS_PATH/$$SIYUAN_DATA_BACKUP_NAME-$$STAMP.tar.gz"
          echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE"
          tar -C /data --exclude='./temp' --exclude='./.siyuan/history' -zcpf "$$DATA_FILE" .; RC=$$?
          if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
            echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)"
          else
            echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2
            mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true
          fi
          if [ "$${SIYUAN_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
            find "$$SIYUAN_BACKUPS_PATH" -type f \( -name "$$SIYUAN_BACKUP_NAME-*" -o -name "$$SIYUAN_DATA_BACKUP_NAME-*" \) -mtime "+$$SIYUAN_BACKUP_PRUNE_DAYS" -delete
          fi
          sleep "$$SIYUAN_BACKUP_INTERVAL"
        done
    volumes:
      - ./workspace:/data
      - siyuan-backups:${SIYUAN_BACKUPS_PATH:-/srv/siyuan/backups}
    environment:
      SIYUAN_BACKUP_INIT_SLEEP: ${SIYUAN_BACKUP_INIT_SLEEP:-30m}
      SIYUAN_BACKUP_INTERVAL: ${SIYUAN_BACKUP_INTERVAL:-24h}
      SIYUAN_BACKUP_PRUNE_DAYS: ${SIYUAN_BACKUP_PRUNE_DAYS:-7}
      SIYUAN_BACKUPS_PATH: ${SIYUAN_BACKUPS_PATH:-/srv/siyuan/backups}
      SIYUAN_BACKUP_NAME: ${SIYUAN_BACKUP_NAME:-siyuan-database-backup}
      SIYUAN_DATA_BACKUP_NAME: ${SIYUAN_DATA_BACKUP_NAME:-siyuan-data-backup}
    restart: unless-stopped
