name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned siyuan image from the compose file
        id: pin
        run: |
          image="$(grep -m1 -oE '\$\{SIYUAN_IMAGE_TAG:-.*' siyuan-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "SIYUAN_IMAGE_TAG default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of siyuan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-siyuan.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-siyuan.sarif
          category: trivy-siyuan

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned digest against what the tag resolves to now
        run: |
          pin="$(grep -m1 -oE '\$\{SIYUAN_IMAGE_TAG:-.*' siyuan-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_digest="${pin##*@}"
          # Three attempts: an unanswered registry lookup used to leave this empty,
          # and the comparison below then reported it as drift.
          current_digest=""
          for attempt in 1 2 3; do
            current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            [ -n "$current_digest" ] && break
            sleep $(( attempt * 5 ))
          done
          if [ -z "$current_digest" ]; then
            echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
            exit 1
          fi
          if [ "$pinned_digest" != "$current_digest" ]; then
            echo "::error::digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
            exit 1
          fi
          echo "SIYUAN_IMAGE_TAG OK (${ref})"

      - name: Compare the pinned version against the latest SiYuan release
        run: |
          pin="$(grep -m1 -oE '\$\{SIYUAN_IMAGE_TAG:-.*' siyuan-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_version="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/siyuan-note/siyuan/releases/latest | jq -r .tag_name)"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest SiYuan release from the GitHub API"
            exit 1
          fi
          if [ "$pinned_version" != "$latest" ]; then
            echo "::error::SiYuan pin is behind: pinned ${pinned_version}, latest release is ${latest}"
            exit 1
          fi
          echo "SiYuan pin ${pinned_version} matches the latest release"

  deploy-and-test:
    name: docker compose up + SiYuan kernel smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      DOCKER_COMPOSE_FILE: siyuan-docker-compose.yml
      COMPOSE_PROJECT_NAME: siyuan

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker network
        run: docker network create siyuan-network || true

      - name: Generate test .env with an ephemeral access code
        run: |
          cat > .env <<EOF
          SIYUAN_AUTH_CODE=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          SIYUAN_BACKUP_INIT_SLEEP=15s
          SIYUAN_BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Wait for the SiYuan kernel to answer
        # 401 is the success signal here: the kernel is up and the access
        # code from .env is enforced on the UI.
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6806/ | grep -qE "200|302|401"; do
            echo "Waiting for the SiYuan kernel..."
            sleep 5
          done'
          curl -s -o /dev/null -w "SiYuan kernel: %{http_code}\n" http://127.0.0.1:6806/

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races an archive still being written.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -qE "Data backup (OK|FAILED)"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the data archive failed"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null" && echo "Data backup valid: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Scenarios against the live stack: required-env guard, backup set
        # produced, archive and database copy valid, failure detected when the
        # backups directory cannot be written, restore genuinely replaces the
        # data (application stopped, copy put back, marker gone), prune keeps
        # recent files. Same script a maintainer runs on a staging copy.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
